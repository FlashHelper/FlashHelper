basePath: /api
definitions:
  dto.ErrorResponse:
    properties:
      error:
        example: unauthorized
        type: string
        x-order: "2"
      success:
        example: false
        type: boolean
        x-order: "1"
    type: object
  dto.LoginRequest:
    properties:
      password:
        example: flashhelper-dev-password
        maxLength: 72
        type: string
        x-order: "2"
      username:
        example: admin
        maxLength: 100
        type: string
        x-order: "1"
    required:
    - password
    - username
    type: object
  dto.LoginResponse:
    properties:
      expires_at:
        example: "2026-11-04T21:09:38+07:00"
        type: string
        x-order: "2"
      role:
        example: ADMIN
        type: string
        x-order: "4"
      session_id:
        example: HZd-KGRl6mSP3XTLBccL9E4EiGqdwyyngtf7-FVrk0k
        type: string
        x-order: "1"
      username:
        example: admin
        type: string
        x-order: "3"
    type: object
  dto.LoginSuccessResponse:
    properties:
      data:
        allOf:
        - $ref: '#/definitions/dto.LoginResponse'
        x-order: "2"
      success:
        example: true
        type: boolean
        x-order: "1"
    type: object
  dto.SuccessResponse:
    properties:
      success:
        example: true
        type: boolean
        x-order: "1"
    type: object
info:
  contact: {}
  description: API documentation cho FlashHelper
  termsOfService: http://swagger.io/terms/
  title: FlashHelper API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Kiểm tra username/password và tạo session. Session ID được trả
        về trong body và trong cookie session_id
      parameters:
      - description: Thông tin đăng nhập
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.LoginSuccessResponse'
        "400":
          description: invalid request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: invalid username or password
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Đăng nhập
      tags:
      - auth
  /auth/logout:
    post:
      description: Hủy session hiện tại
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.SuccessResponse'
        "401":
          description: unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - SessionAuth: []
      summary: Đăng xuất
      tags:
      - auth
securityDefinitions:
  SessionAuth:
    description: 'Nhập session ID theo định dạng: Bearer <session_id>'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
